language: yupian
file_extensions: [rkt, yupian]
comments:
  line: ";"
strings:
  delimiters: ['"', '"']
numbers:
  pattern: "[-+]?(?:[0-9]+(?:\\.[0-9]*)?|\\.[0-9]+)"
delimiters:
  list: ["(", ")", "「", "」"]
  vector: ["[", "]", "『", "』"]
keywords: [木, 水, 火, 土, 竹, 十, 戈, 大, 中, 一, 弓, 人, 心, 手, 口, 尸, 廿, 山, 田, 難, 卜]